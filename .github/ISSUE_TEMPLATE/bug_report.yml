name: Bug report / 问题反馈
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, real conversations, runtime databases or private project information.
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, Python, Node, CodeDuo and CLI versions; omit personal paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
